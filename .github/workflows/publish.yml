name: Publish next post

on:
  schedule:
    - cron: "0 8-13 * * 1,3,5"   # Mon/Wed/Fri hourly 16:00–21:00 SGT; --window posts once, 19:00–21:59
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 publish.py next ${{ github.event_name == 'schedule' && '--window' || '' }}
      - name: Record posted item
        run: |
          git config user.name "list.sg publisher"
          git config user.email "actions@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || { git commit -m "Posted $(date -u +%F)"; git push; }
